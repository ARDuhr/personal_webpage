<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="German power market model dashboard." />
    <title>Power Market Model — Arthur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=2026-11-10d" />
    <link rel="stylesheet" href="power-market-model.css?v=2026-11-10d" />
  </head>
  <body>
    <div class="custom-cursor" aria-hidden="true"></div>
    <main class="page-shell model-page">
      <header class="site-header model-header">
        <a class="back-link" href="./">←&nbsp; Back to main page</a>
        <p class="header-note" id="snapshot-updated">LAST UPDATED: —</p>
      </header>

      <section class="model-intro" aria-labelledby="page-title">
        <h1 id="page-title">Power market<br />overview</h1>
      </section>

      <section class="chart-grid" aria-label="Power market charts">
        <article class="chart-panel chart-panel--wip">
          <div class="chart-heading">
            <p class="eyebrow">GERMANY / EUR PER MWH</p>
            <h2>Power price</h2>
          </div>
          <div class="wip-state"><span>WIP</span></div>
        </article>

        <article class="chart-panel" id="supply-panel">
          <div class="chart-heading">
            <p class="eyebrow">GERMANY / GW</p>
            <h2>Power supply</h2>
          </div>
          <div class="view-tabs" role="group" aria-label="Supply chart view">
            <button type="button" data-view="mix" aria-pressed="true">MIX OVER TIME</button>
            <button type="button" data-view="merit" aria-pressed="false">MERIT ORDER</button>
          </div>
          <div class="chart-wrap">
            <div class="chart-loading">Loading supply data…</div>
            <svg role="img" aria-label="German power generation by source and demand"></svg>
            <div class="chart-tip" hidden></div>
          </div>
          <div class="moment">
            <span class="moment-label">—</span>
            <input type="range" min="0" value="0" aria-label="Moment shown in the merit order" />
          </div>
          <div class="legend" aria-label="Supply chart legend"></div>
          <p class="supply-note"></p>
        </article>

        <article class="chart-panel chart-panel--demand">
          <div class="chart-heading">
            <p class="eyebrow">GERMANY / GW</p>
            <h2>Power demand</h2>
          </div>
          <div class="chart-wrap" id="demand-chart-wrap">
            <div class="chart-loading" id="chart-status">Loading demand data…</div>
            <svg id="demand-chart" viewBox="0 0 640 320" role="img" aria-labelledby="demand-chart-title demand-chart-description" preserveAspectRatio="none">
              <title id="demand-chart-title">German power demand</title>
              <desc id="demand-chart-description">Actual demand and selected demand model forecasts.</desc>
            </svg>
          </div>
          <div class="legend" id="demand-legend" aria-label="Demand chart legend"></div>
          <fieldset class="model-choices" id="demand-model-choices">
            <legend>FORECASTING MODELS</legend>
          </fieldset>
        </article>
      </section>

      <footer><span>© 2026 ARTHUR</span><span id="data-window">POWER MARKET MODEL</span></footer>
    </main>
    <script src="cursor.js?v=2026-11-10d"></script>
    <script src="power-market-model.js?v=2026-11-10d"></script>
    <script src="power-market-model-supply.js?v=2026-11-10d"></script>
  </body>
</html>
